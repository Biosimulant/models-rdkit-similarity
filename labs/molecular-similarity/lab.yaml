schema_version: '2.0'
package: rdkit-molecular-similarity-search
version: 0.1.0
title: RDKit Molecular Similarity Search
description: Rank molecules in your supplied collection using Morgan radius 2, 2048
  bits, chirality enabled and Tanimoto similarity. Query/hit drawings, exact scores
  and downloadable rankings; CPU only.
license: BSD-3-Clause
models:
- alias: search
  path: models/search
wiring: []
io:
  inputs:
  - name: query_smiles
    maps_to: search.query_smiles
    signal_type: scalar
    dtype: str
    required: true
    value_type: string
    max_length: 8192
    description: One query molecular SMILES; all fragments retained.
  - name: collection_csv
    maps_to: search.collection_csv
    signal_type: scalar
    dtype: str
    required: false
    value_type: string
    max_length: 2097152
    default: ''
    description: Paste UTF-8 molecule_id,smiles CSV; search only this collection,
      <=10000 rows / 2 MiB.
  - name: collection_file
    maps_to: search.collection_file
    signal_type: scalar
    dtype: str
    required: false
    value_type: file
    format: csv
    description: Upload UTF-8 molecule_id,smiles CSV; <=10000 rows / 2 MiB.
  - name: top_k
    maps_to: search.top_k
    signal_type: scalar
    dtype: int64
    required: false
    default: 10
    value_type: integer
    description: Maximum ranked hits; integer 1..100.
  - name: minimum_similarity
    maps_to: search.minimum_similarity
    signal_type: scalar
    dtype: float64
    required: false
    default: 0.0
    value_type: number
    description: Inclusive Tanimoto threshold in [0,1].
  outputs:
  - name: report
    maps_to: search.report
    signal_type: record
    schema:
      hits: json
      invalid_rows: json
      receipt: json
    emitted_unit: '1'
  - name: hit_count
    maps_to: search.hit_count
    signal_type: scalar
    dtype: int64
    emitted_unit: count
  - name: rankings_csv
    maps_to: search.rankings_csv
    signal_type: scalar
    dtype: str
    value_type: file
    format: csv
  - name: rankings_json
    maps_to: search.rankings_json
    signal_type: scalar
    dtype: str
    value_type: file
    format: json
  - name: invalid_csv
    maps_to: search.invalid_csv
    signal_type: scalar
    dtype: str
    value_type: file
    format: csv
  - name: receipt_file
    maps_to: search.receipt_file
    signal_type: scalar
    dtype: str
    value_type: file
    format: json
  - name: drawings
    maps_to: search.drawings
    signal_type: scalar
    dtype: str
    value_type: file
    format: png
runtime:
  python_version: '3.12'
  duration: 1.0
  communication_step: 1.0
  initial_inputs: {}
  dependencies:
    packages:
    - biosimulant==0.0.34
    - rdkit==2025.9.1
    - numpy==2.2.6
    - Pillow==11.3.0
hardware:
  compute:
    device: cpu
    cpu_cores: 0.5
    memory_mb: 512
    recommended_profile: free
intended_use:
  statement: Structural ranking against exactly the supplied collection, <=10000 rows;
    not a search of all chemistry.
caveats:
- Morgan radius2, 2048 bits, includeChirality=True; Tanimoto on-bit intersection/union.
- No desalt, neutralization or tautomer standardization; preserve all fragments.
- Keep all duplicates; ties by descending score, exact Unicode ID then row index.
- Structural similarity does not establish potency, activity, toxicity, safety or
  patent status.
- A score of 1 is not identity; exact_match uses canonical isomeric SMILES.
- Parity and demonstrations are software verification, not broad biological validation.
prohibited_claims:
- Equal potency/activity/toxicity
- Patent clearance
- Search of all known chemistry
- Clinical decisions
visualization:
  schema_version: '1'
  required:
  - module: search
    render: image
    min_count: 1
  - module: search
    render: text
    min_count: 1
